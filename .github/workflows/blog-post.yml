name: Update latest blog posts

on:
  schedule:
    - cron: "0 0 * * *" # 매일 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@1.9.7
        with:
          feed_list: "https://devminseok.github.io/tech-blog-swift/feed.xml"
          max_post_count: 2
          template: "- [$title]($url) <sub>$date</sub>$newline"
          date_format: "yyyy.mm.dd"
          commit_message: "Update latest blog posts"
